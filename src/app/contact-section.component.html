<section class="contact-section" id="contact" aria-labelledby="contact-title">
  <div class="contact-copy">
    <p class="section-label section-label--dark" data-reveal>Επικοινωνία</p>
    <h2 id="contact-title" data-reveal style="--reveal-delay: 110ms">Ας ξεκινήσουμε το επόμενο project.</h2>
    <p data-reveal style="--reveal-delay: 190ms">
      Στείλε μας λίγες πληροφορίες για την επιχείρηση, τις υπηρεσίες και τον στόχο σου. Θα επιστρέψουμε με καθαρή πρόταση και επόμενα βήματα.
    </p>
    <div class="contact-details" data-reveal style="--reveal-delay: 260ms">
      <a href="mailto:hello@eongroup.gr">hello@eongroup.gr</a>
      <span>Ελλάδα · Απομακρυσμένες συνεργασίες σε όλη την Ελλάδα</span>
    </div>
  </div>

  <form class="contact-form" aria-label="Φόρμα επικοινωνίας" data-reveal="visual" style="--reveal-delay: 160ms">
    <label>
      Όνομα
      <input type="text" name="name" autocomplete="name" placeholder="Το όνομά σου">
    </label>
    <label>
      Email
      <input type="email" name="email" autocomplete="email" placeholder="you@example.com">
    </label>
    <label>
      Τι χρειάζεσαι;
      <textarea name="message" rows="5" placeholder="Νέα ιστοσελίδα, ανασχεδιασμός, SEO, καμπάνιες..."></textarea>
    </label>
    <button class="button button--accent" type="button">Αποστολή ενδιαφέροντος <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></button>
  </form>
</section>
